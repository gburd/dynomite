name: docs

# Builds the mdBook reference manual, runs the documentation link
# checker (mdbook-linkcheck2 for internal links + lychee for external
# URLs and man-page references), and deploys the result to GitHub
# Pages. The Codeberg mirror runs the parallel `.forgejo/workflows/
# docs.yml` which publishes to Codeberg Pages from the `pages` branch.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: "0.5.3"
  MDBOOK_MERMAID_VERSION: "0.17.0"
  MDBOOK_LINKCHECK2_VERSION: "0.12.2"

jobs:
  build:
    name: build book + check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install mdbook toolchain
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@${{ env.MDBOOK_VERSION }},mdbook-mermaid@${{ env.MDBOOK_MERMAID_VERSION }},mdbook-linkcheck2@${{ env.MDBOOK_LINKCHECK2_VERSION }},lychee
      - name: build book (internal links checked by mdbook-linkcheck2)
        # Renders with GitHub source-link URLs so readers on GitHub
        # Pages follow repo links to github.com (the Codeberg build
        # uses codeberg.org). See scripts/render-book.sh.
        run: scripts/render-book.sh github
      - name: external link + man-page check (lychee)
        # Internal links are already gated by mdbook-linkcheck2 in the
        # build step above; this external check is informational and
        # must not block publishing internally-correct docs when a
        # third-party host is rate-limiting or down on the CI runner.
        continue-on-error: true
        run: |
          lychee --config docs/book/lychee.toml \
            'docs/book/src/**/*.md' 'README.md' 'crates/**/README.md'
      - name: upload pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/book/html

  deploy:
    name: deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
