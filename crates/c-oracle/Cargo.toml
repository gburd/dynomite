[package]
name = "c-oracle"
description = "Test-only FFI harness that compiles the C Dynomite reference so its functions can serve as oracles for the Rust transliteration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# This crate exists only to call C functions from tests. Every call
# crosses the C ABI, so `unsafe_code` is allowed here and nowhere else in
# the transliterated engine. Justified in docs/journal/allowances.md.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
dynomite = { path = "../dynomite", package = "dynomite-engine" }
hegeltest = { workspace = true }
nix = { workspace = true }
