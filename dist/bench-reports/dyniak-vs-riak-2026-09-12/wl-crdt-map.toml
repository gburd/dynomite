# CRDT map-update workload (single LWW-register field per map).
# Runs against the `maps` Riak/dyniak CRDT bucket type. See
# wl-crdt-counter.toml for the one-op-class-per-bucket rationale.

[run]
duration = "90s"
concurrent = 16
rate = "max"
out_dir = "auto"
report_interval = "1s"

[driver]
kind = "riak_pbc"
host = "127.0.0.1"
port = 8087
bucket = "crdts_map"
timeout_ms = 5000

[ops]
map_update = 1

[keygen]
kind = "uniform"
max = 10000
prefix = "ck_"

[valgen]
kind = "uniform"
min = 8
max = 64
